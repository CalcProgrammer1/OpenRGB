name: MacOS

on:
  push:
    branches:
      - master
      - main
    tags:
      - '*'
  pull_request:

env:
  CI_PROJECT_DIR: ${{ github.workspace }}
  CI_COMMIT_SHORT_SHA: ${{ github.sha }}

jobs:
  #-----------------------------------------------------------#
  # MacOS ARM64 builds                                        #
  #-----------------------------------------------------------#
  macos-arm64:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build for ARM64
        run: |
          chmod +x ./scripts/build-macos.sh
          ./scripts/build-macos.sh qt6 arm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB_MacOS_ARM64_${{ github.sha }}
          path: OpenRGB.app
          retention-days: 30

    if: |
      (github.repository == 'CalcProgrammer1/OpenRGB' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request')) ||
      (github.repository != 'CalcProgrammer1/OpenRGB' && github.event_name == 'push')

  #-----------------------------------------------------------#
  # MacOS Intel builds                                        #
  #-----------------------------------------------------------#
  macos-intel:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build for Intel
        run: |
          chmod +x ./scripts/build-macos.sh
          ./scripts/build-macos.sh qt6 intel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB_MacOS_Intel_${{ github.sha }}
          path: OpenRGB.app
          retention-days: 30

    if: |
      (github.repository == 'CalcProgrammer1/OpenRGB' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' ||
        startsWith(github.ref, 'refs/tags/') || github.event_name == 'pull_request')) ||
      (github.repository != 'CalcProgrammer1/OpenRGB' && github.event_name == 'push')

  #-----------------------------------------------------------#
  # MacOS ARM64 Qt5 builds (manual)                           #
  #-----------------------------------------------------------#
  macos-arm64-qt5:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build for ARM64 Qt5
        run: |
          chmod +x ./scripts/build-macos.sh
          ./scripts/build-macos.sh qt5 arm

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB_MacOS_Qt5_ARM64_${{ github.sha }}
          path: OpenRGB.app
          retention-days: 30
          optional: true

    if: github.event_name == 'workflow_dispatch'

  #-----------------------------------------------------------#
  # MacOS Intel Qt5 builds (manual)                           #
  #-----------------------------------------------------------#
  macos-intel-qt5:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build for Intel Qt5
        run: |
          chmod +x ./scripts/build-macos.sh
          ./scripts/build-macos.sh qt5 intel

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenRGB_MacOS_Qt5_Intel_${{ github.sha }}
          path: OpenRGB.app
          retention-days: 30
          optional: true

    if: github.event_name == 'workflow_dispatch'
